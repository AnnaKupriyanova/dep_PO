server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Прокси на бэкенд для всех API запросов
    location /api {
        proxy_pass http://app:5000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /discovery {
        proxy_pass http://app:5000/discovery;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://app:5000/health;
        proxy_set_header Host $host;
    }

    location /upload {
        proxy_pass http://app:5000/upload;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }

    location /upload_model_files {
        proxy_pass http://app:5000/upload_model_files;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }

    location /copy_photos {
        proxy_pass http://app:5000/copy_photos;
        proxy_set_header Host $host;
    }

    location /train {
        proxy_pass http://app:5000/train;
        proxy_set_header Host $host;
    }

    location /create_class {
        proxy_pass http://app:5000/create_class;
        proxy_set_header Host $host;
    }

    location /model {
        proxy_pass http://app:5000/model;
        proxy_set_header Host $host;
    }

    # Статические файлы
    location /static {
        alias /usr/share/nginx/html/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }
}