server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Статические файлы
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси на бэкенд
    location /discovery {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }

    location /upload {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }

    location /train {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }

    location /create_class {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }

    location /copy_photos {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }

    location /upload_model_files {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }

    location /model {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
    }
}